[package]
name = "sage"
version = "0.11.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

# fontdue dessine le texte à partir des polices du système ; gda est le modèle partagé avec
# Rustcraft (maillages, armatures, peaux, animations, GLB pour S.A.G.E.). OpenGL ES est
# chargé à l'exécution via dlopen : les libEGL de Termux (Mesa) n'existent pas sur
# Android, il ne faut surtout pas lier dessus. png et jpeg-decoder décodent les textures du
# .glb, comme dans Rustcraft.
[dependencies]
fontdue = "0.9"
gda = { path = "../gda" }
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
